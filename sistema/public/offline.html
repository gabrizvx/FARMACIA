<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff0a41">
  <title>Sin conexión | FARM SJB</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f8f9fa; color: #212529; }
    main { width: min(90%, 32rem); padding: 2rem; text-align: center; background: #fff; border-radius: 1rem; box-shadow: 0 1rem 2rem #1118271a; }
    .brand { display: grid; width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; place-items: center; border-radius: 50%; background: #ff0a41; color: #fff; font-size: 2rem; font-weight: 700; }
    h1 { margin: 0 0 .75rem; font-size: 1.6rem; }
    p { margin: 0 0 1.5rem; line-height: 1.6; color: #59636e; }
    a { display: inline-block; padding: .7rem 1.1rem; border-radius: .6rem; background: #ff0a41; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">+</div>
    <h1>No hay conexión</h1>
    <p>Conéctate a Internet para consultar información actualizada y realizar operaciones. No se guardan ventas ni cambios mientras el sistema está sin conexión.</p>
    <a href="/">Intentar de nuevo</a>
  </main>
</body>
</html>
